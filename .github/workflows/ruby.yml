name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PREMAKE: ./premake5
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3.12', '3.4.9', '4.0.5']

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Download Premake
        run: wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz
      - name: Install Premake
        run: |
          tar xf premake-5.0.0-beta8-linux.tar.gz
          chmod +x premake5
      - name: Run complete validation gate
        run: ruby script/complete_gate.rb

  test-macos:
    runs-on: macos-15-intel
    env:
      PREMAKE: ./premake5

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - name: Download Premake
        run: curl --fail --location --retry 3 --output premake-5.0.0-beta8-macosx-x64.tar.gz https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-macosx-x64.tar.gz
      - name: Install Premake
        run: |
          tar xf premake-5.0.0-beta8-macosx-x64.tar.gz
          chmod +x premake5
          echo "CLANG_FORMAT=$(brew --prefix llvm@18)/bin/clang-format" >> "$GITHUB_ENV"
      - name: Run complete validation gate
        run: ruby script/complete_gate.rb

  test-windows:
    runs-on: windows-latest
    env:
      PREMAKE: .\premake5.exe

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - name: Download Premake
        shell: pwsh
        run: curl.exe --fail --location --retry 3 --output premake-5.0.0-beta8-windows.zip https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip
      - name: Install Premake
        shell: pwsh
        run: Expand-Archive -LiteralPath premake-5.0.0-beta8-windows.zip -DestinationPath .
      - name: Run complete validation gate
        shell: pwsh
        run: ruby script/complete_gate.rb
