<header class="site-header" role="banner">
  <a class="mobile-title" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

  {% if site.data.public_site.navigation %}
    <nav class="site-nav" aria-label="Primary navigation">
      <div class="trigger">
        {% for item in site.data.public_site.navigation %}
          <a class="page-link" href="{{ item.target | relative_url }}">{{ item.title | escape }}</a>
        {% endfor %}
      </div>
      <div class="mobile-reference-links">
        <a class="page-link" href="{{ "/vm/opcodes.html" | relative_url }}">VM opcodes</a>
        <a class="page-link" href="{{ "/license.html" | relative_url }}">License</a>
      </div>
    </nav>
  {% endif %}
</header>
