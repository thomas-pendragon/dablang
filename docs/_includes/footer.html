<footer class="site-footer">
  <div class="footer-signature" aria-label="Created by Thomas Pendragon">
    <p class="footer-kicker">Created by</p>
    <p class="footer-author-name"><span>Thomas</span> <em>Pendragon</em></p>
  </div>

  <div class="footer-author-details">
    <p class="footer-biography">{{ site.author_bio | escape }}</p>

    <nav class="footer-links" aria-label="Thomas Pendragon online">
      {% if site.github_username %}
        <div class="footer-social-row">
          {% include icon-github.html username=site.github_username %}
          <span aria-hidden="true">→</span>
        </div>
      {% endif %}
      {% if site.twitter_username %}
        <div class="footer-social-row">
          {% include icon-twitter.html username=site.twitter_username %}
          <span aria-hidden="true">→</span>
        </div>
      {% endif %}
    </nav>
  </div>
</footer>
